<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEISS DENTAL - Эмчийн хяналтын хэсэг</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <!-- Login / Нэвтрэх хэсэг -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 w-full max-w-md text-center">
            <div class="w-14 h-14 bg-sky-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-sky-600/30">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-1">Эмч нэвтрэх</h2>
            <p class="text-xs text-slate-400 mb-6">WEISS DENTAL CLINIC систем</p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <input type="password" id="passwordInput" class="w-full border border-slate-200 p-3.5 rounded-xl text-sm focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 outline-none text-center tracking-widest" placeholder="Нууц үг оруулах" required />
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-sky-600/20 text-sm">
                    Нэвтрэх
                </button>
            </form>
            <p id="loginError" class="text-xs text-rose-500 font-semibold mt-3 hidden">Нууц үг буруу байна!</p>
        </div>
    </div>

    <!-- Admin Dashboard / Админ хэсэг -->
    <div id="adminSection" class="hidden min-h-screen pb-12">
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-sky-600 rounded-xl flex items-center justify-center text-white text-sm">
                        <i class="fa-solid fa-tooth"></i>
                    </div>
                    <h1 class="font-bold text-slate-900 text-base">Захиалгын хяналт</h1>
                </div>
                <button onclick="logout()" class="text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 border border-rose-100 px-4 py-2 rounded-xl transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Гарах
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-900">Ирсэн цаг захиалгууд</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Google Sheet-ээс шууд шинэчлэгдэн харагдана</p>
                </div>
                <button onclick="loadBookings()" class="text-xs font-bold bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right text-sky-600"></i> Шинэчлэх
                </button>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 font-extrabold uppercase tracking-wider border-b border-slate-200">
                            <tr>
                                <th class="p-4">Өдөр / Цаг</th>
                                <th class="p-4">Овог Нэр</th>
                                <th class="p-4">Утас</th>
                                <th class="p-4">Имэйл</th>
                                <th class="p-4">Үйлчилгээ</th>
                                <th class="p-4">Төлөв</th>
                                <th class="p-4">Тэмдэглэл</th>
                            </tr>
                        </thead>
                        <tbody id="bookingTableBody" class="divide-y divide-slate-100 font-medium">
                            <tr>
                                <td colspan="7" class="p-8 text-center text-slate-400">Мэдээлэл уншиж байна...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz03I2krpgtNGSa9jvpp0WKFm89JSiWRbia12kIxf7Jz2EC1MOKF4GN0Sb-XGn-sA/exec';
        const ADMIN_PASS = 'admin123';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadBookings();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        function logout() {
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }

        function loadBookings() {
            const tbody = document.getElementById('bookingTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Мэдээлэл уншиж байна...</td></tr>';

            fetch(SCRIPT_URL + '?action=getBookings')
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">Одоогоор ямар нэг захиалга ирээгүй байна.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(b => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-bold text-slate-900">${b.date || ''}<br><span class="text-sky-600 font-semibold">${b.time || ''}</span></td>
                        <td class="p-4 font-bold text-slate-800">${b.surname || ''} ${b.name || ''}</td>
                        <td class="p-4 font-bold text-slate-700">${b.phone || ''}</td>
                        <td class="p-4 text-slate-500">${b.email || '-'}</td>
                        <td class="p-4"><span class="bg-sky-50 text-sky-700 border border-sky-100 px-2.5 py-1 rounded-lg text-[11px] font-bold">${b.service || ''}</span></td>
                        <td class="p-4"><span class="bg-amber-50 text-amber-700 border border-amber-100 px-2.5 py-1 rounded-lg text-[11px] font-bold">${b.status || 'Хүлээгдэж буй'}</span></td>
                        <td class="p-4 text-slate-500">${b.notes || '-'}</td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-rose-500 font-bold">Захиалгын мэдээлэл татахад алдаа гарлаа. Шинэчилж үзнэ үү.</td></tr>';
            });
        }
    </script>
</body>
</html>
